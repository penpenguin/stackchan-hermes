[project]
name = "stackchan-hermes-bridge"
version = "0.1.0"
description = "Bridge, simulator, and MCP integration for M5Stack StackChan and HermesAgent"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES/README.md",
    "LICENSES/*.json",
    "LICENSES/texts/*.txt",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "ifaddr>=0.2",
    "mcp>=2,<3",
    "numpy>=2.2",
    "opuslib-next>=1.3",
    "pillow>=11.3",
    "platformdirs>=4.3",
    "prometheus-client>=0.22",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "typer>=0.16",
    "uvicorn[standard]>=0.35",
    "websockets>=15",
    "zeroconf>=0.147",
]

[project.optional-dependencies]
stt-local = [
    "faster-whisper>=1.2,<2",
]

[project.scripts]
stackchan-bridge = "stackchan_bridge.cli:entrypoint"
stackchan-mcp = "stackchan_bridge.mcp_server.cli:entrypoint"
stackchan-simulator = "stackchan_simulator.cli:entrypoint"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "jsonschema>=4.25",
    "mypy>=1.17",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "referencing>=0.36",
    "respx>=0.22",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "bridge/src/stackchan_bridge",
    "simulator/src/stackchan_simulator",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "bridge/src/stackchan_bridge",
    "simulator/src/stackchan_simulator",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES",
    "docs/licensing.md",
    "docs/license-audit.md",
    "docs/license-inventory",
    "uv.lock",
]

[tool.uv]
required-version = ">=0.9.2"

[tool.pytest.ini_options]
testpaths = ["bridge/tests", "simulator/tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["stackchan_bridge", "stackchan_simulator"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["firmware"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["bridge/src", "simulator/src"]
